name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download pinned RenPy SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.zip -OutFile "$env:RUNNER_TEMP/renpy.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/renpy.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ff57648f9c04f27e381c48af6d8e3ee3cdec296bed4d3831f47f09b0a71b505e') { throw 'RenPy SDK checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/renpy.zip" -DestinationPath ..
      - run: npm ci
      - run: npm test
      - run: npm run native:test
      - run: npm run desktop
      - name: Verify native storage, generated branches, packaged Save/Load and ordinary game startup
        run: npm run verify:release
        env:
          ISTORIYA_QA_ROOT: ${{ runner.temp }}/IstoriyaQA
      - name: Build candidate installer
        shell: pwsh
        run: ./scripts/build-native-installer.ps1 -SkipBuild -OutputDirectory "$env:RUNNER_TEMP/istoriya-setup"
      - name: Install old release, upgrade, ordinary UI startup, reinstall and uninstall without losing projects
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-hosted-installer.mjs "$env:RUNNER_TEMP/istoriya-setup/Istoriya-Rust-Setup-$version-x64.exe"
          if ($LASTEXITCODE) { throw 'Hosted installer acceptance failed' }
