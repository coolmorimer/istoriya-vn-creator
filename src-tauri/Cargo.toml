[package]
name = "istoriya"
version = "0.2.38"
edition = "2021"
description = "История — конструктор визуальных новелл"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
istoriya-core = { path = "../crates/istoriya-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"
url = "2"
dunce = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
